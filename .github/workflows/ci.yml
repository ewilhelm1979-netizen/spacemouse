name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.3.0, independently verified against the upstream tag.
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action v31, independently verified against the upstream tag.
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Run the complete local validation matrix
        run: nix flake check --no-write-lock-file
